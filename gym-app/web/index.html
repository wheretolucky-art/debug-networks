<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111315">
<title>PPL Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#111315;--s1:#1b1e22;--s2:#24282d;--line:#30353b;--text:#f1f3f5;--muted:#9aa3ad;--dim:#6c757d;
  --push:#f76707;--pull:#15aabf;--legs:#9775fa;--rest:#868e96;
  --good:#51cf66;--warn:#fcc419;--bad:#ff6b6b;--accent:#f76707;--r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
body.resting{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:4px;padding:10px 8px 8px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1}
.iconbtn{background:none;border:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.iconbtn:active{background:var(--s2)}
.iconbtn svg{width:22px;height:22px}
main{padding:14px 16px 24px;max-width:640px;margin:0 auto}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--s1);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{background:none;border:0;color:var(--dim);padding:8px 0 7px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
nav.bottom button.on{color:var(--text)}
nav.bottom button.on svg{color:var(--accent)}
nav.bottom svg{width:24px;height:24px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card h2{font-size:17px;margin:0 0 8px}
.card h3{font-size:15px;margin:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
.btn{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600;min-height:46px;cursor:pointer}
.btn:active{filter:brightness(1.2)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.block{width:100%;display:block}
.btn.small{padding:8px 12px;font-size:14px;min-height:38px;border-radius:10px}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1}
.hero{border:0;color:#fff;position:relative;overflow:hidden}
.hero .kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}
.hero .big{font-size:26px;font-weight:800;margin:4px 0 2px;line-height:1.15}
.hero .btn{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.25);color:#fff}
.hero .btn.primary{background:#fff;color:#111}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.chip.on{color:#fff;border-color:transparent;background:var(--accent)}
.chip.done{opacity:.55}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.rot{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.rot div{border-radius:8px;padding:6px 0;text-align:center;font-size:11.5px;line-height:1.25;font-weight:700;background:var(--s2);color:var(--muted);border:1px solid transparent}
.rot div.next{color:#fff;border-color:#fff}
.rot div.did{opacity:.45}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input.in,select.in,textarea.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:17px;min-height:46px}
textarea.in{min-height:84px;resize:vertical;font-size:15px}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:8px 16px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.seg input:checked+span{background:var(--s2);color:var(--text)}
.bar{margin:8px 0}
.bar .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
.track{height:8px;border-radius:99px;background:var(--s2);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.track i.over{background:var(--warn)}
.ex{scroll-margin-top:70px}
.ex .name{font-size:17px;font-weight:700}
.ex .meta{font-size:13px;color:var(--muted);margin-top:2px}
.ex .cue{font-size:13px;color:var(--dim);font-style:italic;margin-top:4px}
.ex .last{font-size:13.5px;margin-top:8px;color:var(--muted)}
.advice{margin-top:8px;font-size:13.5px;border-radius:10px;padding:8px 10px;background:var(--s2)}
.advice.up{background:rgba(81,207,102,.14);color:#b2f2bb}
.advice.down{background:rgba(252,196,25,.14);color:#ffe066}
.advice.new{background:rgba(21,170,191,.14);color:#99e9f2}
.sets{margin-top:10px}
.setrow{display:grid;grid-template-columns:30px 1fr 18px 1fr 52px;align-items:center;gap:6px;margin-top:6px}
.setrow .n{color:var(--muted);font-weight:700;text-align:center}
.setrow .x{color:var(--dim);text-align:center}
.setrow input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 4px;font-size:18px;text-align:center;min-height:46px}
.setrow input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.setrow .bw{text-align:center;color:var(--dim);font-size:14px}
.tick{width:52px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--s2);display:grid;place-items:center;cursor:pointer}
.tick svg{width:22px;height:22px;color:var(--dim)}
.setrow.done input{background:rgba(81,207,102,.10);border-color:rgba(81,207,102,.35)}
.setrow.done .tick{background:var(--good);border-color:transparent}
.setrow.done .tick svg{color:#0b2e13}
.labels{display:grid;grid-template-columns:30px 1fr 18px 1fr 52px;gap:6px;font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.rirs{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.rirs .chip{padding:5px 10px}
.list{margin:0;padding:0;list-style:none}
.list li{padding:11px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.tap{cursor:pointer}
.meal{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.check{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer}
.check svg{width:22px;height:22px;opacity:0}
.check.on{background:var(--good);border-color:transparent}
.check.on svg{opacity:1;color:#0b2e13}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--warn);color:#2b2100;vertical-align:middle}
.stat{font-size:26px;font-weight:800;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats .lbl{font-size:12px;color:var(--muted);margin-top:2px}
svg.chart{width:100%;height:auto;display:block}
.banner{background:linear-gradient(135deg,#2b8a3e,#1971c2);border:0;color:#fff}
#restbar{position:fixed;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom));z-index:7;background:var(--s2);border-top:1px solid var(--line);padding:10px 16px 12px}
#restbar .btn{white-space:nowrap}
#restbar #restLabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#restbar .time{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#restbar .track{margin:8px 0 10px}
#restbar.ending .time{color:var(--warn)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:20;background:#f1f3f5;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14.5px;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
dialog#sheet{width:100%;max-width:640px;margin:auto auto 0;border:0;border-radius:18px 18px 0 0;background:var(--s1);color:var(--text);padding:0;max-height:92vh}
dialog#sheet[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(0,0,0,.6)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:10px 8px 10px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:18px}
.sheet-body{padding:14px 16px calc(24px + env(safe-area-inset-bottom));overflow:auto}
pre.report{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12.5px;line-height:1.45;max-height:46vh;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
.foods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.foods button{text-align:left;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;cursor:pointer}
.foods button b{display:block;font-size:14px}
.musc{display:grid;grid-template-columns:90px 1fr 54px;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 2px 8px}
.sec:first-child{margin-top:0}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datebar strong{font-size:16px}
</style>
</head>
<body>
<header>
  <h1 id="title">Today</h1>
  <button class="iconbtn" data-act="report" aria-label="Weekly report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v3H9zM9 11h6M9 15h4"/></svg></button>
  <button class="iconbtn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</header>
<main id="main"></main>

<div id="restbar" hidden>
  <div class="tiny muted" id="restLabel">Rest</div>
  <div class="row between" style="margin-top:2px">
    <div class="time" id="restTime">0:00</div>
    <div class="row" style="gap:8px">
      <button class="btn small" data-act="restAdj" data-d="-15" aria-label="15 seconds less">−15s</button>
      <button class="btn small" data-act="restAdj" data-d="15" aria-label="15 seconds more">+15s</button>
      <button class="btn small primary" data-act="restSkip">Skip</button>
    </div>
  </div>
  <div class="track"><i id="restFill" style="width:0%"></i></div>
</div>

<nav class="bottom" id="nav">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Today</button>
  <button data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Workout</button>
  <button data-tab="diet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M12 7c0-2 1.5-3.5 3.5-3.5M9 7.5c-.5-1.5 0-3 1.5-3.5"/></svg>Diet</button>
  <button data-tab="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7.5 10a6 6 0 0 1 9 0"/><path d="M12 10l2-2.5"/></svg>Body</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V5M16 20v-7M2 20h20"/></svg>Progress</button>
</nav>

<dialog id="sheet"><div class="sheet-head"><h2 id="sheetTitle"></h2><button class="iconbtn" data-act="closeSheet" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sheet-body" id="sheetBody"></div></dialog>
<div id="toast"></div>
<input type="file" id="restoreFile" accept="application/json,.json,text/plain" hidden>

<script>
(function () {
'use strict';

/* ---------- Constants and default plan ---------- */
var KEY = 'ppl-coach-v1';
var APP = window.GymAndroid || null;
var TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var EQUIP_NOTE = { barbell: 'Plates only, no bar', smith: 'Plates only, no bar', ez: 'Plates only, no bar', db: 'Per dumbbell', stack: 'Stack number', plates: 'Plates only, no sled', bw: 'Bodyweight' };
var INC = { barbell: 2.5, smith: 2.5, ez: 2.5, db: 2.5, plates: 5, stack: 0, bw: 2.5 };
var MUSCLES = ['chest', 'back', 'sidedelts', 'reardelts', 'frontdelts', 'biceps', 'triceps', 'quads', 'hamstrings', 'glutes', 'calves', 'abs'];
var MUSCLE_NAME = { chest: 'Chest', back: 'Back', sidedelts: 'Side delts', reardelts: 'Rear delts', frontdelts: 'Front delts', biceps: 'Biceps', triceps: 'Triceps', quads: 'Quads', hamstrings: 'Hamstrings', glutes: 'Glutes', calves: 'Calves', abs: 'Abs' };
var KIND_COLOR = { push: 'var(--push)', pull: 'var(--pull)', legs: 'var(--legs)' };
var KIND_BG = { push: 'linear-gradient(135deg,#e8590c,#c2410c)', pull: 'linear-gradient(135deg,#0c8599,#0b7285)', legs: 'linear-gradient(135deg,#7048e8,#5f3dc4)' };

function X(id, name, equip, muscles, sets, min, max, rir, rest, cue, extra) {
  var e = { id: id, name: name, equip: equip, muscles: muscles, sets: sets, min: min, max: max, rir: rir, rest: rest, cue: cue };
  if (extra) for (var k in extra) e[k] = extra[k];
  return e;
}
function defaultProgram() {
  return {
    name: 'PPL starting plan',
    rotation: ['pushA', 'pullA', 'legsA', 'pushB', 'pullB', 'legsB', 'rest'],
    sessions: {
      pushA: { name: 'Push A', focus: 'Chest', kind: 'push', exercises: [
        X('bench', 'Barbell bench press', 'barbell', ['chest'], 3, 6, 10, '1–2', 180, 'Shoulder blades pinned, bar to lower chest'),
        X('inclinedb', 'Incline DB press (30°)', 'db', ['chest'], 3, 8, 12, '1–2', 150, 'Elbows about 45°, full stretch at the bottom'),
        X('cablefly', 'Cable fly (mid height)', 'stack', ['chest'], 2, 12, 15, '0–1', 90, 'Lock the elbow bend, squeeze hands together', { note: 'Stack number, one side' }),
        X('latraise', 'DB lateral raise', 'db', ['sidedelts'], 4, 12, 20, '0–1', 75, 'Lead with the elbows, no swinging'),
        X('pushdown', 'Rope pushdown', 'stack', ['triceps'], 3, 10, 15, '0–1', 90, 'Elbows pinned, full lockout')
      ] },
      pullA: { name: 'Pull A', focus: 'Lats', kind: 'pull', exercises: [
        X('pulldown', 'Lat pulldown', 'stack', ['back'], 3, 8, 12, '1–2', 120, "Elbows to ribs, don't lean back"),
        X('csrow', 'Chest-supported row', 'stack', ['back'], 3, 8, 12, '1–2', 120, 'Chest stays on the pad', { note: 'Plates or stack, or per DB' }),
        X('straightarm', 'Straight-arm cable pulldown', 'stack', ['back'], 2, 12, 15, '0–1', 90, 'Arms nearly straight, sweep to thighs'),
        X('revpec', 'Reverse pec deck', 'stack', ['reardelts'], 3, 12, 20, '0–1', 75, 'Push hands out wide, not back'),
        X('inclinecurl', 'Incline DB curl', 'db', ['biceps'], 3, 8, 12, '0–1', 90, 'Arms hang behind the body, shoulders still'),
        X('hammer', 'Hammer curl', 'db', ['biceps'], 2, 10, 15, '0–1', 60, 'Elbows fixed')
      ] },
      legsA: { name: 'Legs A', focus: 'Quads', kind: 'legs', exercises: [
        X('squat', 'Back squat', 'barbell', ['quads'], 3, 6, 10, '2', 180, 'Brace hard, knees track over toes'),
        X('legpress', 'Leg press', 'plates', ['quads'], 3, 10, 15, '1–2', 150, 'Go deep but keep hips on the pad'),
        X('seatedcurl', 'Seated leg curl', 'stack', ['hamstrings'], 3, 10, 15, '0–1', 90, 'Lean forward slightly, squeeze at the bottom'),
        X('legext', 'Leg extension', 'stack', ['quads'], 2, 12, 15, '0–1', 90, '1-second squeeze at the top'),
        X('standcalf', 'Standing calf raise', 'stack', ['calves'], 4, 10, 15, '0–1', 60, '2-second pause in the stretch', { note: 'Stack or plates' }),
        X('cablecrunch', 'Cable crunch', 'stack', ['abs'], 3, 10, 15, '0–1', 60, "Round the spine, hips don't move")
      ] },
      pushB: { name: 'Push B', focus: 'Upper chest and shoulders', kind: 'push', exercises: [
        X('inclinesmith', 'Incline Smith press (30°)', 'smith', ['chest'], 3, 6, 10, '1–2', 165, 'Bar to upper chest, no bounce'),
        X('dbpress', 'Seated DB shoulder press', 'db', ['frontdelts'], 3, 8, 12, '1–2', 120, 'Lower to ear level'),
        X('lowhighfly', 'Low-to-high cable fly', 'stack', ['chest'], 3, 12, 15, '0–1', 90, 'Hands finish at chin height', { note: 'Stack number, one side' }),
        X('cablelat', 'Cable lateral raise', 'stack', ['sidedelts'], 4, 12, 20, '0–1', 75, 'Slow on the way down'),
        X('ohext', 'Overhead cable triceps extension', 'stack', ['triceps'], 3, 10, 15, '0–1', 90, 'Deep stretch, elbows fixed')
      ] },
      pullB: { name: 'Pull B', focus: 'Upper back', kind: 'pull', exercises: [
        X('pullup', 'Pull-up (assisted if needed)', 'bw', ['back'], 3, 6, 10, '1–2', 150, 'Full hang, chest toward the bar', { note: 'Bodyweight = 0, assisted = minus kg (−20)' }),
        X('widerow', 'Wide-grip seated cable row', 'stack', ['back'], 3, 10, 12, '1–2', 120, 'Elbows flared, pull to lower chest'),
        X('dbrow', 'Single-arm DB row', 'db', ['back'], 2, 10, 12, '1–2', 90, 'Pull toward the hip, stretch at the bottom'),
        X('facepull', 'Face pull', 'stack', ['reardelts'], 3, 12, 20, '0–1', 75, 'Pull to forehead, rotate hands out'),
        X('ezcurl', 'EZ-bar curl', 'ez', ['biceps'], 3, 8, 12, '0–1', 105, 'No hip swing'),
        X('cablecurl', 'Cable curl', 'stack', ['biceps'], 2, 12, 15, '0–1', 60, 'Full stretch at the bottom')
      ] },
      legsB: { name: 'Legs B', focus: 'Hamstrings and glutes', kind: 'legs', exercises: [
        X('lyingcurl', 'Lying leg curl', 'stack', ['hamstrings'], 3, 8, 12, '0–1', 105, 'Hips pressed into the pad'),

  histOpen: function (el) { showHistory(el.dataset.id); },
  shareWorkout: function (el) { var w = S.workouts.filter(function (x) { return x.id === el.dataset.id; })[0]; if (w) shareText(workoutText(w)); },
  delWorkout: function (el) { var id = el.dataset.id; ask('Delete this workout?', 'It will be removed from your history and progress.', 'Delete', function () { S.workouts = S.workouts.filter(function (x) { return x.id !== id; }); save(); closeSheet(); render(); toast('Workout deleted'); }, true); },
  dietDay: function (el) { var d = addDays(dietDate, +el.dataset.d); if (d > today()) return; dietDate = d; render(); },
  planDay: function (el) { setFood(function (f) { f.plan = +el.dataset.i; f.eaten = {}; }); },
  meal: function (el) { setFood(function (f) { var i = el.dataset.i; if (f.eaten[i]) delete f.eaten[i]; else f.eaten[i] = true; }); },
  addFood: function () { addFoodSheet(); },
  quick: function (el) { var q = QUICK[+el.dataset.i]; closeSheet(); setFood(function (f) { f.extras.push({ name: q[0], kcal: q[1], p: q[2], c: q[3], f: q[4] }); }); toast('Added ' + q[0]); },
  saveExtra: function () {
    var n = $('#xName').value.trim(), k = num($('#xK').value), p = num($('#xP').value);
    if (!n) { toast('Name the food'); return; }
    if (k == null || k < 0 || k > 5000) { toast('Enter the calories'); return; }
    closeSheet(); setFood(function (f) { f.extras.push({ name: n.slice(0, 60), kcal: k, p: p || 0, c: 0, f: 0 }); });
  },
  delExtra: function (el) { setFood(function (f) { f.extras.splice(+el.dataset.i, 1); }); },
  saveBody: function () {
    var d = $('#bDate').value || today(); if (d > today()) { toast('That date is in the future'); return; }
    var b = S.body[d] || {}, w = num($('#bW').value), s = num($('#bS').value), wa = num($('#bWa').value), g = document.querySelector('input[name=bG]:checked'), gn = $('#bGn').value.trim();
    if (w != null && (w < 30 || w > 200)) { toast('Check the weight'); return; }
    if (s != null && (s < 0 || s > 16)) { toast('Check the sleep hours'); return; }
    if (wa != null && (wa < 40 || wa > 200)) { toast('Check the waist'); return; }
    if (w != null) b.weight = w; else delete b.weight;
    if (s != null) b.sleep = s; else delete b.sleep;
    if (wa != null) b.waist = wa; else delete b.waist;
    if (g) b.gas = g.value === 'yes';
    if (gn) b.gasNote = gn.slice(0, 120); else delete b.gasNote;
    if (Object.keys(b).length) S.body[d] = b; else delete S.body[d];
    bodyDate = d; save(); render(); toast('Saved ' + nice(d));
  },
  bodyEdit: function (el) { bodyDate = el.dataset.d; render(); window.scrollTo(0, 0); },
  checkPlan: function () {
    var box = $('#planPreview');
    try {
      pendingPlan = parsePlan($('#planCode').value);
      var p = pendingPlan.program;
      box.innerHTML = '<div class="card" style="margin-top:10px;border-color:var(--good)"><b>' + esc(p.name) + '</b><ul class="list small">' + p.rotation.map(function (id) { return '<li>' + (id === 'rest' ? 'Rest day' : esc(p.sessions[id].name + ' · ' + p.sessions[id].focus) + ' <span class="muted">(' + p.sessions[id].exercises.length + ' exercises)</span>'); }).join('') + '</ul>' + (pendingPlan.diet ? '<p class="small muted">Also updates the diet' + (pendingPlan.diet.targets ? ' (' + pendingPlan.diet.targets.kcal + ' kcal, ' + pendingPlan.diet.targets.protein + ' g protein)' : '') + '.</p>' : '') + '<button class="btn primary block" data-act="applyPlan">Use this plan</button></div>';
    } catch (e) { pendingPlan = null; box.innerHTML = '<p class="small" style="color:var(--bad)">' + esc(e.message) + '</p>'; }
  },
  applyPlan: function () {
    if (!pendingPlan) return;
    S.program = pendingPlan.program;
    if (pendingPlan.diet) { if (pendingPlan.diet.targets) S.diet.targets = pendingPlan.diet.targets; if (pendingPlan.diet.days) S.diet.days = pendingPlan.diet.days; }
    S.nextOverride = trainIds()[0] || null;
    pendingPlan = null; save(); closeSheet(); go('today'); toast('New plan saved. History is kept.');
  },
  sharePlan: function () { shareText(planCode()); },
  saveTargets: function () {
    var k = num($('#tK').value), p = num($('#tP').value), c = num($('#tC').value), f = num($('#tF').value);
    if (!k || k < 1000 || k > 6000 || !p || p < 30 || p > 400 || c == null || f == null) { toast('Check the numbers'); return; }
    S.diet.targets = { kcal: Math.round(k), protein: Math.round(p), carbs: Math.round(c), fat: Math.round(f) }; save(); toast('Targets saved'); render();
  },
  backup: function () { backup(); },
  restore: function () { $('#restoreFile').click(); },
  eraseAll: function () { ask('Erase everything?', 'All workouts, check-ins and food logs on this phone will be deleted. Back up first if you might want them.', 'Erase all', function () { S = defaults(); save(); stopRest(); tryApp('keepAwake', false); closeSheet(); go('today'); toast('All data erased'); }, true); },
  restAdj: function (el) {
    if (!rest) return; var d = +el.dataset.d;
    rest.end += d * 1000; rest.total = Math.max(5, rest.total + d);
    var left = rest.end - Date.now(); if (left <= 0) { stopRest(); return; }
    tryApp('startRest', left, rest.label); tick();
  },
  restSkip: function () { stopRest(); }
};
function refreshEx(i) { var el = $('#ex-' + i); if (el) el.outerHTML = exCard(i); }

document.addEventListener('click', function (ev) {
  var nb = ev.target.closest('#nav button');
  if (nb) { closeSheet(); go(nb.dataset.tab); return; }
  var t = ev.target.closest('[data-act]');
  if (!t || t.disabled) return;
  var fn = ACT[t.dataset.act];
  if (fn) { ev.preventDefault(); fn(t, ev); }
});
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el.id === 'repNotes') {
    var ws = el.dataset.week; S.meta.reportNotes[ws] = el.value.slice(0, 1000); saveSoon();
    var pre = $('#repText'); if (pre) pre.textContent = weeklyReport(ws);
    return;
  }
  if (!S.active || !el.dataset || !el.dataset.f) return;
  if (el.dataset.f === 'notes') { S.active.notes = el.value.slice(0, 1000); saveSoon(); return; }
  var e = S.active.ex[+el.dataset.ex], s = e && e.sets[+el.dataset.set];
  if (!s) return;
  var v = num(el.value);
  s[el.dataset.f] = v == null ? '' : v;
  saveSoon();
});
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.id === 'bDate') { bodyDate = el.value && el.value <= today() ? el.value : today(); render(); }
  else if (el.id === 'progSel') { progEx = el.value; drawExChart(); }
  else if (el.id === 'nextSel') { S.nextOverride = el.value; save(); render(); toast('Next workout: ' + sess(el.value).name); }
});
document.addEventListener('visibilitychange', function () { if (!document.hidden) { tick(); if (tab === 'today') render(); } });
$('#sheet').addEventListener('close', function () { askCb = null; });

/* ---------- Start ---------- */
load();
if (S.active) tryApp('keepAwake', true);
render();
})();
</script>
</body>
</html>
